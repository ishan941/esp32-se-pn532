[platformio]
default_envs = esp32-s3-n16r8

[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 921600
monitor_speed = 115200

; Memory & Flash config for ESP32-S3 N16R8 (16MB Flash, 8MB Octal PSRAM)
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

; Build flags:
; Use hardware UART0 for Serial since your board is connected via /dev/cu.usbserial-* (CH340/CP2102)
build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=2

; Required libraries
lib_deps = 
    adafruit/Adafruit PN532 @ ^1.3.3
    adafruit/Adafruit BusIO @ ^1.16.1
    Wire
